<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>E-commerce 3D - Tênis Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="canvas-container"></div>

    // Controles de customização e brilho
    <nav class="controls-top">
        <div class="control-group">
            <label>Customização por Parte</label>
            
            <select id="partSelector" style="display: block; margin-bottom: 10px; width: 100%; padding: 4px; border-radius: 4px;">
                <option value="TUDO">Tênis Inteiro</option>
                <option value="Object_2">Parte 2 (Sola/Base)</option>
                <option value="Object_3">Parte 3</option>
                <option value="Object_4">Parte 4</option>
                <option value="Object_5">Parte 5</option>
            </select>

            <div class="color-picker">
                <button class="color-part-btn" data-color="#ff0000" style="background: red;"></button>
                <button class="color-part-btn" data-color="#0000ff" style="background: blue;"></button>
                <button class="color-part-btn" data-color="#ffffff" style="background: white;"></button>
                <button class="color-part-btn" data-color="#333333" style="background: black;"></button>
                <button class="color-part-btn" data-color="#00ff00" style="background: green;"></button>
            </div>
        </div>

        <div class="control-group">
            <label>Brilho da Luz</label>
            <input type="range" id="lightIntensity" min="0" max="10" step="0.1" value="2">
        </div>
        
        <div class="control-group">
            <label>Velocidade de rotação</label>
            <input type="range" id="speedControl" min="0" max="0.1" step="0.001" value="0.01">
        </div>
    </nav>

    <aside class="brands-sidebar">
        <button class="brand-item" data-brand="nike_air_zoom_pegasus_36">
            <img src="logos/logo nike.png" alt="Nike"> <span>Nike</span>
        </button>
        <button class="brand-item" data-brand="adidas_ozelia">
            <img src="logos/logo adidas.png" alt="Adidas"> <span>Adidas</span>
        </button>
        <button class="brand-item" data-brand="puma_suede">
            <img src="logos/logo puma.png" alt="Puma"> <span>Puma</span>
        </button>
        <button class="brand-item" data-brand="tenis_olympikus">
            <img src="logos/logo olympikus.png" alt="Olympikus"> <span>Olympikus</span>
        </button>
    </aside>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
